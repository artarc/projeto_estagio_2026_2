{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AssetFlow — solicitação de empréstimos de equipamentos de TI.">
    <title>{% block title %}AssetFlow{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{% url 'home' %}" aria-label="AssetFlow — página inicial">
                <span>Asset<span>Flow</span></span>
            </a>
            <nav class="main-nav" aria-label="Navegação principal">
                <a href="{% url 'home' %}#como-funciona">Como funciona</a>
                {% if user.is_authenticated %}
                    <a class="button button-small" href="{% url 'dashboard' %}">Abrir painel</a>
                {% else %}
                    <a class="button button-small" href="{% url 'login' %}">Acessar painel</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div>
                <a class="brand brand-footer" href="{% url 'home' %}">Asset<span>Flow</span></a>
                <p>© 2026 AssetFlow. Projeto de teste técnico.</p>
            </div>
            <nav aria-label="Navegação do rodapé">
                <a href="{% url 'home' %}#como-funciona">Como funciona</a>
                <a href="{% url 'login' %}">Acessar painel</a>
            </nav>
        </div>
    </footer>
</body>
</html>

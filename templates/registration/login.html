{% extends "base.html" %}

{% block title %}Entrar no painel | AssetFlow{% endblock %}

{% block content %}
<section class="login-section">
    <div class="login-panel">
        <div class="section-heading">
            <h1>Acesse o painel</h1>
        </div>

        {% if form.errors %}
            <div class="alert alert-error" role="alert">
                <span aria-hidden="true">!</span>
                <p>Usuário ou senha inválidos. Tente novamente.</p>
            </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="form-field">
                <label for="id_username">Usuário</label>
                <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
            </div>
            <div class="form-field">
                <label for="id_password">Senha</label>
                <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
            </div>
            <button class="button" type="submit">Entrar</button>
        </form>
    </div>
</section>
{% endblock %}
